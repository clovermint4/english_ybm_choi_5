<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F92AB">
<title>영어 대모험 — 6개의 섬</title>
</head>
<body>
<title>영어 대모험 — 6개의 섬</title>
<style>
  :root{
    --sky1:#8FD6EC; --sky2:#C4ECF6;
    --ocean:#1F92AB; --ocean-deep:#0C5568;
    --sand:#F7DFA6; --sand-dk:#E6C179;
    --coral:#FF6F5E; --coral-dk:#E44E3C;
    --gold:#FFC53D; --gold-dk:#EFA715;
    --leaf:#4EB478; --leaf-dk:#37935E;
    --grape:#8C6BE0; --grape-dk:#6E4FC4;
    --ink:#0E3B49; --ink-soft:#41707F;
    --card:#FFFFFF; --cream:#FFF9EE;
    --shadow:0 10px 0 rgba(12,85,104,.16), 0 18px 34px rgba(12,85,104,.22);
    --font: "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font); color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%, var(--sky2) 42%, var(--ocean) 100%);
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #app{
    position:relative; width:100%; height:100dvh; max-width:1024px; margin:0 auto;
    overflow:hidden;
  }
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity .35s ease;}
  .screen.on{opacity:1; pointer-events:auto;}

  /* decorative clouds */
  .cloud{position:absolute; background:#fff; border-radius:50%; opacity:.75; filter:blur(.3px);}
  .cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}

  /* ---------- INTRO ---------- */
  #intro{align-items:center; justify-content:center; text-align:center; gap:0; padding:24px;}
  .title-badge{
    background:var(--cream); border:6px solid #fff; border-radius:34px;
    padding:32px 40px 30px; box-shadow:var(--shadow); max-width:560px; width:100%;
    position:relative; z-index:2;
  }
  .kicker{font-size:15px; font-weight:800; letter-spacing:.22em; color:var(--coral); text-transform:uppercase;}
  .title-main{font-size:clamp(38px,9vw,66px); font-weight:900; line-height:1.02; margin:10px 0 4px;
    color:var(--ocean-deep); text-wrap:balance; letter-spacing:-.02em;}
  .title-en{font-size:clamp(15px,3.6vw,20px); font-weight:800; color:var(--ink-soft); letter-spacing:.04em;}
  .islands-row{font-size:clamp(30px,8vw,46px); margin:16px 0 6px; letter-spacing:2px;}
  .subtitle{font-size:15px; color:var(--ink-soft); font-weight:600; margin-bottom:22px; line-height:1.5;}
  .avatar-pick{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:22px;}
  .avatar{width:56px; height:56px; border-radius:50%; border:3px solid transparent; background:#fff;
    font-size:30px; display:grid; place-items:center; cursor:pointer; box-shadow:0 4px 0 rgba(12,85,104,.12);
    transition:transform .12s, border-color .12s;}
  .avatar.sel{border-color:var(--coral); transform:translateY(-4px) scale(1.08);}

  .btn{
    font-family:var(--font); font-weight:900; cursor:pointer; border:none;
    border-radius:22px; color:#fff; letter-spacing:.01em;
    background:var(--coral); box-shadow:0 7px 0 var(--coral-dk), 0 14px 22px rgba(228,78,60,.34);
    transition:transform .09s, box-shadow .09s;
  }
  .btn:active{transform:translateY(5px); box-shadow:0 2px 0 var(--coral-dk), 0 6px 12px rgba(228,78,60,.3);}
  .btn:focus-visible{outline:4px solid #fff; outline-offset:3px;}
  .btn-lg{font-size:23px; padding:20px 46px;}
  .btn-gold{background:var(--gold); box-shadow:0 7px 0 var(--gold-dk), 0 14px 22px rgba(239,167,21,.34); color:var(--ocean-deep);}
  .btn-gold:active{box-shadow:0 2px 0 var(--gold-dk);}
  .btn-ghost{background:#fff; color:var(--ink); box-shadow:0 6px 0 rgba(12,85,104,.14);}
  .btn-ghost:active{box-shadow:0 2px 0 rgba(12,85,104,.14);}

  /* ---------- HUD ---------- */
  #hud{display:flex; align-items:center; gap:8px; padding:12px 14px; z-index:5;}
  .hud-chip{background:rgba(255,255,255,.92); border-radius:16px; padding:7px 13px;
    font-weight:900; font-size:17px; display:flex; align-items:center; gap:6px;
    box-shadow:0 4px 0 rgba(12,85,104,.13); font-variant-numeric:tabular-nums;}
  .hud-chip .ic{font-size:18px;}
  .hud-spacer{flex:1;}
  .icon-btn{width:42px; height:42px; border-radius:14px; border:none; background:rgba(255,255,255,.92);
    font-size:20px; cursor:pointer; box-shadow:0 4px 0 rgba(12,85,104,.13); display:grid; place-items:center;}
  .icon-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(12,85,104,.13);}

  /* ---------- MAP ---------- */
  #map{padding:0;}
  .map-head{text-align:center; padding:2px 16px 6px;}
  .map-head h2{font-size:clamp(20px,5vw,28px); font-weight:900; color:#fff; text-shadow:0 3px 0 rgba(12,85,104,.28);}
  .map-head p{color:var(--ocean-deep); font-weight:700; font-size:13px; opacity:.85;}
  .map-wrap{flex:1; min-height:0; position:relative; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:6px 0 34px;}
  .map-scroll{position:static; overflow:visible;}
  .islands{display:grid; grid-template-columns:repeat(3,1fr); gap:18px 6px;
    width:100%; max-width:600px; margin:0 auto; padding:14px 12px; place-items:start center;}
  .island{
    position:relative; width:100%; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    transition:transform .14s;
  }
  .island:active{transform:scale(.96);}
  .island .disk{
    width:clamp(74px,23vw,116px); height:clamp(74px,23vw,116px); border-radius:50%; display:grid; place-items:center;
    font-size:clamp(32px,10vw,50px); position:relative;
    background:radial-gradient(circle at 50% 34%, var(--sand) 0 58%, var(--sand-dk) 59% 100%);
    box-shadow:0 12px 0 rgba(12,85,104,.16), inset 0 -8px 0 rgba(0,0,0,.06);
    border:5px solid #fff;
  }
  .island .num{position:absolute; top:-8px; left:-8px; width:38px; height:38px; border-radius:50%;
    background:var(--ocean-deep); color:#fff; font-weight:900; font-size:17px; display:grid; place-items:center;
    border:3px solid #fff; box-shadow:0 3px 0 rgba(0,0,0,.2);}
  .island .name{margin-top:9px; background:#fff; padding:5px 10px; border-radius:13px; font-weight:800;
    font-size:clamp(11px,3vw,13px); color:var(--ink); box-shadow:0 4px 0 rgba(12,85,104,.12); line-height:1.2; max-width:100%; word-break:keep-all;}
  .island .stars{margin-top:5px; font-size:15px; letter-spacing:1px; height:18px;}
  .island.locked{cursor:not-allowed;}
  .island.locked .disk{background:#B9C7CC; filter:grayscale(.4);}
  .island.locked .disk::after{content:"🔒"; position:absolute; font-size:40px;}
  .island.locked .name{opacity:.55;}
  .island.done .disk{box-shadow:0 12px 0 rgba(55,147,94,.3), 0 0 0 5px #fff, 0 0 24px rgba(255,197,61,.6);}
  .path-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:-1;}
  .map-cta{padding:10px 16px calc(12px + env(safe-area-inset-bottom)); text-align:center;}

  /* ---------- STAGE ---------- */
  #stage{padding:0;}
  .q-progress{display:flex; gap:6px; padding:2px 16px 8px;}
  .pip{flex:1; height:9px; border-radius:6px; background:rgba(255,255,255,.5);}
  .pip.done{background:var(--gold);}
  .pip.cur{background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.4);}
  .stage-body{flex:1; min-height:0; display:flex; flex-direction:column; padding:6px 18px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .combo-flag{align-self:center; background:var(--grape); color:#fff; font-weight:900; font-size:14px;
    padding:5px 15px; border-radius:20px; box-shadow:0 4px 0 var(--grape-dk); margin-bottom:8px; min-height:0;
    transition:transform .2s; }
  .combo-flag.pop{animation:pop .4s;}
  @keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
  .prompt-card{
    background:var(--card); border-radius:28px; padding:26px 22px; text-align:center;
    box-shadow:var(--shadow); margin:6px 0 18px; position:relative; border:5px solid #fff;
  }
  .q-type{font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--coral); margin-bottom:12px;}
  .q-main{font-size:clamp(30px,8vw,46px); font-weight:900; color:var(--ocean-deep); line-height:1.12; text-wrap:balance; word-break:keep-all;}
  .q-sub{font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:8px;}
  .speak-btn{width:96px; height:96px; border-radius:50%; margin:6px auto 0; font-size:44px;
    background:var(--gold); border:none; cursor:pointer; box-shadow:0 7px 0 var(--gold-dk); display:grid; place-items:center;}
  .speak-btn:active{transform:translateY(4px); box-shadow:0 3px 0 var(--gold-dk);}
  .speak-btn.ring{animation:ring .5s;}
  @keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:420px){.choices{gap:9px;}}
  .choice{
    background:#fff; border:none; border-bottom:6px solid rgba(12,85,104,.16); border-radius:20px;
    padding:20px 14px; font-family:var(--font); font-size:clamp(17px,4.6vw,22px); font-weight:800; color:var(--ink);
    cursor:pointer; min-height:78px; transition:transform .1s; word-break:keep-all; line-height:1.25;
  }
  .choice:active{transform:translateY(3px);}
  .choice:focus-visible{outline:4px solid var(--coral); outline-offset:2px;}
  .choice.correct{background:var(--leaf); color:#fff; border-bottom-color:var(--leaf-dk); animation:pop .4s;}
  .choice.wrong{background:var(--coral); color:#fff; border-bottom-color:var(--coral-dk); animation:shake .4s;}
  .choice.dim{opacity:.45;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  /* ---------- RESULT / FINAL ---------- */
  .result-wrap{align-items:center; justify-content:center; text-align:center; padding:24px; gap:0;}
  .result-card{background:var(--cream); border:6px solid #fff; border-radius:36px; padding:34px 30px;
    box-shadow:var(--shadow); max-width:500px; width:100%; z-index:2;}
  .result-card h2{font-size:clamp(26px,7vw,40px); font-weight:900; color:var(--ocean-deep); margin-bottom:4px;}
  .big-stars{font-size:clamp(44px,13vw,72px); letter-spacing:6px; margin:12px 0; min-height:1em;}
  .big-stars span{display:inline-block; opacity:0; transform:scale(0);}
  .big-stars span.show{animation:starpop .5s forwards;}
  @keyframes starpop{0%{opacity:0; transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  .tally{display:flex; justify-content:center; gap:26px; margin:14px 0 22px; font-weight:900;}
  .tally .lbl{font-size:12px; color:var(--ink-soft); font-weight:800; letter-spacing:.08em; display:block; margin-bottom:2px;}
  .tally .val{font-size:26px; color:var(--ocean-deep); font-variant-numeric:tabular-nums;}
  .rank-badge{font-size:clamp(60px,18vw,96px); margin:6px 0;}
  .rank-title{font-size:clamp(24px,6vw,34px); font-weight:900; color:var(--coral); margin-bottom:6px; text-wrap:balance;}
  .result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  .btn-md{font-size:18px; padding:15px 28px;}

  #fx{position:absolute; inset:0; pointer-events:none; z-index:40;}
  .float-coin{position:absolute; font-size:34px; z-index:41; pointer-events:none;
    animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:1; transform:translateY(0) scale(.6)}30%{transform:translateY(-14px) scale(1.2)}100%{opacity:0; transform:translateY(-90px) scale(1)}}

  .heart-lost{animation:heartlost .5s;}
  @keyframes heartlost{0%{transform:scale(1)}40%{transform:scale(1.5); filter:grayscale(0)}100%{transform:scale(1); filter:grayscale(1); opacity:.35}}

  /* ---------- REVIEW (단원 시작 학습 화면) ---------- */
  #review{padding:0;}
  .review-body{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 18px 20px;}
  .review-banner{background:var(--card); border:5px solid #fff; border-radius:26px; padding:20px 20px 22px;
    text-align:center; box-shadow:var(--shadow); margin-bottom:16px;}
  .review-banner .rb-emoji{font-size:54px; line-height:1;}
  .review-banner .rb-num{font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--coral); text-transform:uppercase; margin-top:6px;}
  .review-banner h2{font-size:clamp(22px,6vw,32px); font-weight:900; color:var(--ocean-deep); margin:4px 0 2px; text-wrap:balance;}
  .review-banner .rb-en{font-size:14px; font-weight:700; color:var(--ink-soft);}
  .review-sec-title{font-size:14px; font-weight:900; color:var(--ocean-deep); background:rgba(255,255,255,.85);
    display:inline-block; padding:6px 15px; border-radius:14px; margin:4px 0 11px; box-shadow:0 3px 0 rgba(12,85,104,.12);}
  .word-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  @media(min-width:560px){.word-grid{grid-template-columns:1fr 1fr 1fr;}}
  .word-card{background:#fff; border-radius:16px; padding:12px 14px; box-shadow:0 4px 0 rgba(12,85,104,.12);
    cursor:pointer; text-align:left; border:none; font-family:var(--font); transition:transform .1s;}
  .word-card:active{transform:scale(.96);}
  .word-card .wc-en{font-size:16px; font-weight:900; color:var(--ocean-deep); display:flex; align-items:center;
    justify-content:space-between; gap:6px; word-break:keep-all;}
  .word-card .wc-ko{font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .word-card .spk{font-size:14px; opacity:.55; flex-shrink:0;}
  .phrase-list{display:flex; flex-direction:column; gap:9px;}
  .phrase-card{background:#fff; border-radius:16px; padding:13px 16px; box-shadow:0 4px 0 rgba(12,85,104,.12);
    cursor:pointer; border:none; border-left:6px solid var(--coral); font-family:var(--font); text-align:left; transition:transform .1s;}
  .phrase-card:active{transform:scale(.98);}
  .phrase-card .pc-en{font-size:16px; font-weight:900; color:var(--ocean-deep); word-break:keep-all;}
  .phrase-card .pc-ko{font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:2px;}
  .review-cta{padding:8px 18px calc(14px + env(safe-area-inset-bottom));}
  .review-cta .btn{width:100%;}

  /* ---------- BEST / NEW RECORD ---------- */
  #bestLine{display:none; font-weight:800; color:var(--ocean-deep); background:#fff; border-radius:14px;
    padding:8px 14px; margin-bottom:16px; font-size:14px; box-shadow:0 3px 0 rgba(12,85,104,.1);
    font-variant-numeric:tabular-nums;}
  #finalBestLine{font-weight:800; color:var(--ink-soft); font-size:14px; margin-bottom:16px; font-variant-numeric:tabular-nums;}
  #finalNewrec{display:none; background:var(--gold); color:var(--ocean-deep); font-weight:900; font-size:15px;
    padding:6px 16px; border-radius:16px; margin:2px auto 10px; box-shadow:0 4px 0 var(--gold-dk);
    width:fit-content; animation:pop .5s;}

  /* ---------- TIMER ---------- */
  .timer-wrap{padding:0 18px 4px;}
  .timer-bar{height:12px; border-radius:8px; background:rgba(255,255,255,.5); overflow:hidden;}
  .timer-fill{height:100%; width:100%; background:var(--leaf); border-radius:8px; transition:width .09s linear, background .3s;}
  .timer-fill.warn{background:var(--gold);}
  .timer-fill.danger{background:var(--coral);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.05s !important;}
  }
</style>

<div id="app">
  <canvas id="fx"></canvas>

  <!-- INTRO -->
  <section id="intro" class="screen on">
    <div class="title-badge">
      <div class="kicker">5학년 · 1학기 총복습</div>
      <div class="title-main">영어 대모험</div>
      <div class="title-en">The 6 Islands English Quest</div>
      <div class="islands-row">🏝️ 🏝️ 🏝️ 🏝️ 🏝️ 🏝️</div>
      <div class="subtitle">6개의 섬을 모두 정복하고<br>바다의 영웅이 되어 보자!</div>
      <div id="bestLine">🏅 내 최고기록 · <span id="bestStars">0</span>⭐ · <span id="bestCoins">0</span>🪙</div>
      <div class="avatar-pick" id="avatarPick"></div>
      <button class="btn btn-lg" id="startBtn">모험 시작! ⚓</button>
    </div>
  </section>

  <!-- MAP -->
  <section id="map" class="screen">
    <div id="hud">
      <div class="hud-chip"><span class="ic">🪙</span><span id="hudCoins">0</span></div>
      <div class="hud-chip"><span class="ic">⭐</span><span id="hudStars">0</span>/18</div>
      <div class="hud-spacer"></div>
      <button class="icon-btn" id="soundBtn" title="소리 켜기/끄기">🔊</button>
    </div>
    <div class="map-head">
      <h2>모험 지도</h2>
      <p>열린 섬을 눌러 도전하세요 · 별 3개를 노려봐요!</p>
    </div>
    <div class="map-wrap"><div class="map-scroll"><div class="islands" id="islands"></div></div></div>
  </section>

  <!-- REVIEW (단원 시작 학습 화면) -->
  <section id="review" class="screen">
    <div id="hud">
      <button class="icon-btn" id="rvBackBtn" title="지도로">↩</button>
      <div class="hud-chip"><span class="ic">🪙</span><span id="rvCoins">0</span></div>
      <div class="hud-spacer"></div>
      <button class="icon-btn" id="rvSoundBtn" title="소리">🔊</button>
    </div>
    <div class="review-body" id="reviewBody"></div>
    <div class="review-cta"><button class="btn btn-lg" id="startQuizBtn">외웠으면 도전! ⚔️</button></div>
  </section>

  <!-- STAGE -->
  <section id="stage" class="screen">
    <div id="hudS">
      <div id="hud" style="position:relative">
        <button class="icon-btn" id="backBtn" title="지도로">↩</button>
        <div class="hud-chip"><span class="ic">🪙</span><span id="sCoins">0</span></div>
        <div class="hud-chip" id="heartsChip"><span class="ic">❤️</span><span id="sHearts">❤️❤️❤️</span></div>
        <div class="hud-spacer"></div>
        <div class="hud-chip" id="comboChip" style="background:var(--grape);color:#fff"><span class="ic">🔥</span>x<span id="sCombo">1</span></div>
      </div>
    </div>
    <div class="q-progress" id="qProgress"></div>
    <div class="timer-wrap"><div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div></div>
    <div class="stage-body">
      <div class="combo-flag" id="comboFlag" style="visibility:hidden">🔥 콤보!</div>
      <div class="prompt-card" id="promptCard"></div>
      <div class="choices" id="choices"></div>
    </div>
  </section>

  <!-- STAGE RESULT -->
  <section id="result" class="screen result-wrap">
    <div class="result-card">
      <h2 id="resTitle">섬 클리어!</h2>
      <div class="big-stars" id="resStars"></div>
      <div class="tally">
        <div><span class="lbl">맞힌 문제</span><span class="val" id="resCorrect">0/5</span></div>
        <div><span class="lbl">획득 코인</span><span class="val" id="resCoins">0</span></div>
        <div><span class="lbl">최고 콤보</span><span class="val" id="resCombo">0</span></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost btn-md" id="retryBtn">다시 도전 🔁</button>
        <button class="btn btn-md" id="nextBtn">다음 섬으로 ➡️</button>
      </div>
    </div>
  </section>

  <!-- FINAL -->
  <section id="final" class="screen result-wrap">
    <div class="result-card">
      <div class="kicker" style="color:var(--coral)">모험 완료</div>
      <div class="rank-badge" id="finalBadge">🏆</div>
      <div class="rank-title" id="finalTitle">바다의 영웅!</div>
      <div id="finalNewrec">🎉 신기록 달성!</div>
      <div class="big-stars" id="finalStars" style="font-size:34px; letter-spacing:2px"></div>
      <div class="tally">
        <div><span class="lbl">모은 별</span><span class="val" id="finalStarCount">0/18</span></div>
        <div><span class="lbl">모은 코인</span><span class="val" id="finalCoins">0</span></div>
      </div>

let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(freqs, dur, type, gainv){
  if(!S.soundOn) return; const c=ac(); if(!c) return;
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    const t=c.currentTime+i*0.07;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gainv||0.18,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.18));
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+(dur||0.18)+0.02);
  });
}

const QN = 7; // 문항 수 (난이도 ↑)
const SKIP = new Set(["a","an","the","is","am","are","to","you","i","my","do","this","it","it's","and","at","here","some","of","for","on","in"]);
function makeQuestions(idx){
  const L=LESSONS[idx];
  const pool = L.words.concat(L.phrases); // [en, ko]
  // 표현(문장) 최소 3개 + 단어 4개 섞어서 7문항 — 문장 비중을 높여 체감 난이도 ↑
  const picks = shuffle(shuffle(L.phrases).slice(0,3).concat(shuffle(L.words).slice(0,4))).slice(0,QN);
  const types = shuffle(["fill","en2ko","ko2en","listen","fill","ko2en","listen"]).slice(0,QN);
  return picks.map((item,i)=>{
    let type=types[i];
    const [en,ko]=item;
    const isPhrase = L.phrases.includes(item);
    if(type==="fill" && !isPhrase) type="ko2en"; // 빈칸은 문장에만
    if(type==="fill") return makeFill(en,ko,pool);
    if(type==="en2ko") return {type, question:en, answer:ko, options:distract(ko,pool,1), speakText:en, label:"🔤 무슨 뜻일까?"};
    if(type==="ko2en") return {type, koPrompt:true, question:ko, answer:en, options:distract(en,pool,0), speakText:en, label:"🧠 영어로 뭘까?"};
    return {type:"listen", listen:true, answer:en, options:distract(en,pool,0), speakText:en, label:"🔊 잘 듣고 골라요"};
  });
}
function distract(ans,pool,col){
  const others = shuffle(pool.filter(p=>p[col]!==ans)).slice(0,3).map(p=>p[col]);
  return shuffle([ans, ...others]);
}
function makeFill(en,ko,pool){
  const tokens = en.replace(/[?.!,]/g,"").split(" ");
  let cand = tokens.filter(t=>!SKIP.has(t.toLowerCase()) && t.length>2);
  if(!cand.length) cand = tokens.slice();
  const target = cand.sort((a,b)=>b.length-a.length)[0];
  const re = new RegExp("\\b"+target.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");
  const blanked = en.replace(re, "＿＿＿");
  const bank=[];
  pool.forEach(p=>p[0].replace(/[?.!,]/g,"").split(" ").forEach(w=>{
    if(w.toLowerCase()!==target.toLowerCase() && w.length>2 && !SKIP.has(w.toLowerCase())) bank.push(w);
  }));
  const opts = shuffle([target, ...shuffle([...new Set(bank)]).slice(0,3)]);
  return {type:"fill", question:blanked, answer:target, options:opts, speakText:en, ko, label:"✍️ 빈칸에 알맞은 말은?"};
}

function comboMult(){ return S.combo>=5?3 : S.combo>=3?2 : 1; }

/* ---- 문항 제한시간 타이머 ---- */
let timerId=null, timeLeft=0; const TIME_MAX=9;
function startTimer(){
  clearTimer(); timeLeft=TIME_MAX;
  const fill=$("#timerFill"); fill.className="timer-fill"; fill.style.width="100%";
  const t0=performance.now();
  timerId=setInterval(()=>{
    timeLeft=Math.max(0,TIME_MAX-(performance.now()-t0)/1000);
    const pct=timeLeft/TIME_MAX*100; fill.style.width=pct+"%";
    fill.classList.toggle("warn",pct<50); fill.classList.toggle("danger",pct<25);
    if(timeLeft<=0){ clearTimer(); timeUp(); }
  },80);
}
function clearTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function timeUp(){
  if(S.locked) return; S.locked=true;
  const q=S.questions[S.qIdx];
  const all=$("#choices").querySelectorAll(".choice");
  all.forEach(b=>{ if(b.textContent===q.answer) b.classList.add("correct"); else b.classList.add("dim"); b.style.pointerEvents="none"; });
  S.combo=0; S.hearts=Math.max(0,S.hearts-1); sfx.wrong();
  const hc=$("#heartsChip"); hc.classList.remove("heart-lost"); void hc.offsetWidth; hc.classList.add("heart-lost");
  $("#sHearts").textContent="❤️".repeat(S.hearts)+"🖤".repeat(3-S.hearts);
  $("#sCombo").textContent=comboMult();
  const cf=$("#comboFlag"); cf.style.visibility="visible"; cf.style.background="var(--coral)"; cf.style.boxShadow="0 4px 0 var(--coral-dk)"; cf.textContent="⏰ 시간 초과!";
  setTimeout(()=>{ S.qIdx++; if(S.qIdx>=S.questions.length) stageResult(); else renderQ(); },1500);
}

function answer(btn,opt,q){
  if(S.locked) return; S.locked=true; clearTimer();
  const correct = opt===q.answer;
  const all=$("#choices").querySelectorAll(".choice");
  if(correct){
    btn.classList.add("correct");
    S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    const speed=Math.round(timeLeft); // 빨리 맞힐수록 스피드 보너스 (0~9)
    const gain=10*comboMult()+speed;
    S.coins+=gain; S.coinsThisStage+=gain; S.correct++;
    sfx.correct(); setTimeout(()=>sfx.coin(),120);
    floatCoin(btn, "+"+gain);
    if(q.speakText) setTimeout(()=>speak(q.speakText),200);
  } else {
    btn.classList.add("wrong");
    all.forEach(b=>{ if(b.textContent===q.answer) b.classList.add("correct"); });
    S.combo=0; S.hearts=Math.max(0,S.hearts-1);
    sfx.wrong();
    const hc=$("#heartsChip"); hc.classList.remove("heart-lost"); void hc.offsetWidth; hc.classList.add("heart-lost");
  }
  all.forEach(b=>{ if(!b.classList.contains("correct")&&!b.classList.contains("wrong")) b.classList.add("dim"); b.style.pointerEvents="none"; });
  $("#sCoins").textContent=S.coins;
  $("#sHearts").textContent="❤️".repeat(S.hearts)+"🖤".repeat(3-S.hearts);
  $("#sCombo").textContent=comboMult();
  setTimeout(()=>{
    S.qIdx++;
    if(S.qIdx>=S.questions.length) stageResult();
    else renderQ();
  }, correct?900:1500);
}

function floatCoin(btn,txt){
  const r=btn.getBoundingClientRect(), ar=$("#app").getBoundingClientRect();
  const el=document.createElement("div"); el.className="float-coin"; el.textContent="🪙"+txt;
  el.style.left=(r.left-ar.left+r.width/2-24)+"px"; el.style.top=(r.top-ar.top)+"px";
  $("#app").appendChild(el); setTimeout(()=>el.remove(),1000);
}

  if(earned>prev){ S.totalStars += (earned-prev); S.stars[S.stageIdx]=earned; }
  // unlock next
  if(earned>0 && S.unlocked < S.stageIdx+2 && S.stageIdx+2<=LESSONS.length){ S.unlocked=S.stageIdx+2; }
  const passed = earned>0;
  show("result");
  $("#resTitle").textContent = passed ? `${LESSONS[S.stageIdx].emoji} 섬 클리어!` : "앗, 아쉬워!";
  $("#resCorrect").textContent = c+"/"+QN;
  $("#resCoins").textContent = "+"+S.coinsThisStage;
  $("#resCombo").textContent = S.maxCombo;
  const starBox=$("#resStars"); starBox.innerHTML="";
  for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent = i<earned?"⭐":"☆"; starBox.appendChild(s); }
  const spans=starBox.querySelectorAll("span");
  spans.forEach((s,i)=>setTimeout(()=>{ s.classList.add("show"); if(i<earned) sfx.coin(); },300+i*350));
  if(passed){ sfx.clear(); confetti(); }
  const isLast = S.stageIdx===LESSONS.length-1;
  const nextBtn=$("#nextBtn");
  nextBtn.textContent = isLast ? "결과 보기 🏆" : "지도로 ➡️";
  nextBtn.onclick=()=>{ sfx.tap();
    if(isLast && S.stars.every(x=>x>0)) showFinal();
    else { show("map"); buildMap(); }
  };
  $("#retryBtn").onclick=()=>{ sfx.tap(); startQuiz(); };
}

/* ================= FINAL ================= */
function showFinal(){
  show("final");
  const rank = RANKS.find(r=>S.totalStars>=r.min);
  $("#finalBadge").textContent=rank.badge;
  $("#finalTitle").textContent=rank.title;
  $("#finalStarCount").textContent=S.totalStars+"/18";
  $("#finalCoins").textContent=S.coins;
  $("#finalStars").textContent = LESSONS.map((_,i)=>"⭐".repeat(S.stars[i])).join(" · ");
  // 최고기록 판정 & 저장
  const best=loadBest();
  const isNew = S.totalStars>best.stars || (S.totalStars===best.stars && S.coins>best.coins);
  if(isNew) saveBest({stars:S.totalStars, coins:S.coins});
  const shownBest = loadBest();
  $("#finalNewrec").style.display = isNew ? "block" : "none";
  $("#finalBestLine").textContent = `🏅 내 최고기록 · ${shownBest.stars}⭐ · ${shownBest.coins}🪙`;
  sfx.clear(); confetti(); setTimeout(confetti,600);
  $("#shareBtn").onclick=()=>{ sfx.tap(); shareCard(rank); };
  $("#againBtn").onclick=()=>{ sfx.tap(); resetState(); buildIntro(); show("intro"); };
}

/* ---- 결과 자랑 카드 이미지 저장 (서버 불필요) ---- */
function roundRect(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function shareCard(rank){
  const W=760,H=940, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#8FD6EC"); g.addColorStop(.5,"#43B0C6"); g.addColorStop(1,"#1F92AB");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  roundRect(x,50,80,W-100,H-160,44); x.fillStyle="#FFF9EE"; x.fill();
  x.textAlign="center"; const F='"Apple SD Gothic Neo", sans-serif';
  x.fillStyle="#FF6F5E"; x.font=`800 24px ${F}`; x.fillText("ENGLISH QUEST · 영어 대모험 완료!",W/2,175);
  x.font="130px sans-serif"; x.fillText(rank.badge,W/2,330);
  x.fillStyle="#FF6F5E"; x.font=`900 46px ${F}`; x.fillText(rank.title,W/2,410);
  x.fillStyle="#0E3B49"; x.font=`900 40px ${F}`;
  x.fillText("⭐ 별  "+S.totalStars+" / 18",W/2,510);
  x.fillText("🪙 코인  "+S.coins,W/2,580);
  x.font="70px sans-serif"; x.fillText(S.avatar,W/2,690);
  x.fillStyle="#41707F"; x.font=`700 26px ${F}`; x.fillText("5학년 1학기 · 1~6단원 총복습",W/2,760);
  x.fillStyle="#8FB4BE"; x.font=`700 22px ${F}`; x.fillText("나도 도전해보기!",W/2,810);
  try{
    const url=c.toDataURL("image/png");
    const a=document.createElement("a"); a.href=url; a.download="영어대모험_결과.png";
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert("결과 화면을 캡처해서 자랑해보세요! 📸"); }
}

/* ================= SOUND TOGGLE ================= */
$("#soundBtn").onclick=()=>{ S.soundOn=!S.soundOn; $("#soundBtn").textContent=S.soundOn?"🔊":"🔇"; if(S.soundOn) sfx.tap(); };

/* ================= CONFETTI ================= */
const cv=$("#fx"); const ctx=cv.getContext("2d"); let parts=[];
function fitCanvas(){ const a=$("#app").getBoundingClientRect(); cv.width=a.width; cv.height=a.height; }
window.addEventListener("resize",fitCanvas); fitCanvas();
function confetti(){
  const cols=["#FF6F5E","#FFC53D","#4EB478","#1F92AB","#8C6BE0","#fff"];
  for(let i=0;i<90;i++){ parts.push({x:cv.width/2+(Math.random()-.5)*120, y:cv.height*0.35,
    vx:(Math.random()-.5)*9, vy:-Math.random()*11-4, g:0.35, s:6+Math.random()*7,
    c:cols[Math.floor(Math.random()*cols.length)], r:Math.random()*6, vr:(Math.random()-.5)*0.4, life:120}); }
  if(!rafOn){ rafOn=true; requestAnimationFrame(tick); }
}
let rafOn=false;
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+40);
  if(parts.length){ requestAnimationFrame(tick); } else { rafOn=false; ctx.clearRect(0,0,cv.width,cv.height); }
}

/* ================= INIT ================= */
buildIntro();
</script>
